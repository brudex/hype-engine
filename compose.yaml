name: hype-engine

x-application: &application
  build:
    context: .
    dockerfile: Dockerfile
  env_file:
    - .env
  depends_on:
    database:
      condition: service_healthy
  restart: unless-stopped

x-application-environment: &application-environment
  NODE_ENV: production
  DBHOST: database
  DBNAME: ${DBNAME:?DBNAME is required}
  DBUSER: ${DBUSER:?DBUSER is required}
  DBPASS: ${DBPASS:?DBPASS is required}
  SITEURL: ${SITEURL:?SITEURL is required}
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
  SEQUELIZE_AUTO_SYNC: ${SEQUELIZE_AUTO_SYNC:-false}

services:
  database:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: ${DBNAME:?DBNAME is required}
      POSTGRES_USER: ${DBUSER:?DBUSER is required}
      POSTGRES_PASSWORD: ${DBPASS:?DBPASS is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  web:
    <<: *application
    environment:
      <<: *application-environment
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - application-logs:/app/logs
      - application-uploads:/app/public/uploads
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  jobs:
    <<: *application
    command:
      - node
      - ./bin/job-www
    environment:
      <<: *application-environment
      PORT: 3001
    ports:
      - "3001:3001"
    volumes:
      - application-logs:/app/logs
      - application-uploads:/app/public/uploads
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://127.0.0.1:3001/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  postgres-data:
  application-logs:
  application-uploads:
